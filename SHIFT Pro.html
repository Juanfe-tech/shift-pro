/* ── TRIPLE RING ──────────────────────────────────── */
const TripleRing = ({con,act,clean,size=260}) => {
  const cx=size/2, stroke=12, gap=4;
  const rings=[
    {r:cx-stroke/2-2,          val:con,  color:C.cyan,   id:'rg0'},
    {r:cx-stroke/2-2-stroke-gap,val:act, color:C.violet, id:'rg1'},
    {r:cx-stroke/2-2-2*(stroke+gap),val:clean,color:C.pink,id:'rg2'},
  ];
  const composite = Math.round((con+act+clean)/3);
  return html`
    <div style=${{position:'relative',display:'inline-block',width:size,height:size}}>
      <svg width=${size} height=${size} style="transform:rotate(-90deg)">
        <defs>
          ${rings.map(r=>html`
            <linearGradient id=${r.id} x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color=${r.color} stop-opacity="0.7"/>
              <stop offset="100%" stop-color=${r.color}/>
            </linearGradient>`)}
        </defs>
        ${rings.map(r=>{
          const c=2*Math.PI*r.r;
          const off=c-(Math.max(0,Math.min(100,r.val))/100)*c;
          return html`
            <g>
              <circle cx=${cx} cy=${cx} r=${r.r} fill="none" stroke=${r.color} stroke-opacity="0.1" stroke-width=${stroke}/>
              <circle cx=${cx} cy=${cx} r=${r.r} fill="none"
                stroke=${'url(#'+r.id+'}'}
                stroke-width=${stroke} stroke-linecap="round"
                stroke-dasharray=${c} stroke-dashoffset=${off}
                style="transition:stroke-dashoffset 1.4s cubic-bezier(0.22,1,0.36,1)"/>
            </g>`;
        })}
      </svg>
      <div style=${{
        position:'absolute',inset:0,display:'flex',flexDirection:'column',
        alignItems:'center',justifyContent:'center'
      }}>
        <div style=${{fontSize:9,letterSpacing:'0.3em',color:C.dim,textTransform:'uppercase',marginBottom:4}}>Today</div>
        <${Gt} size=${44}>${composite}<//>
        <div style=${{fontSize:9,letterSpacing:'0.3em',color:C.dim,textTransform:'uppercase',marginTop:4}}>Composite</div>
      </div>
    </div>`;
};

/* ── HEATMAP ──────────────────────────────────────── */
const Heatmap = ({checkIns,currentDay,actionsPerDay}) => {
  const intensity = day => {
    if(day>currentDay) return -1;
    const ci=checkIns.find(c=>c.day===day);
    if(!ci) return 0;
    let s=0;
    if(ci.morning) s++;
    if(ci.evening) s++;
    if(ci.actionsCompleted>=(actionsPerDay||1)) s++;
    return s;
  };
  const bg = i => {
    if(i<0) return 'transparent';
    if(i===0) return C.ghost;
    if(i===1) return '#22d3ee40';
    if(i===2) return '#a855f780';
    return G;
  };
  return html`
    <div>
      <div style=${{display:'flex',justifyContent:'space-between',marginBottom:16}}>
        <${Label} mb=${0}>90-Day Arc<//>
        <${Label} mb=${0}>Day ${pad(currentDay)} / 90<//>
      </div>
      <div style=${{display:'grid',gridTemplateColumns:'repeat(10,1fr)',gap:4}}>
        ${Array.from({length:90},(_,i)=>{
          const day=i+1, iv=intensity(day), isToday=day===currentDay, isFuture=day>currentDay;
          return html`
            <div title=${'Day '+day} style=${{
              aspectRatio:'1',background:bg(iv),
              border:`1px solid ${isFuture?C.border:isToday?C.violet:'transparent'}`,
              boxShadow:isToday?`0 0 10px ${C.violet}60`:'none',
              transition:'all .3s',
            }}/>`;
        })}
      </div>
      <div style=${{display:'flex',alignItems:'center',justifyContent:'center',gap:16,marginTop:20}}>
        <${Label} mb=${0}>Less<//>
        <div style=${{display:'flex',gap:4}}>
          ${[C.ghost,'#22d3ee40','#a855f780',G].map((c,i)=>html`
            <div style=${{width:12,height:12,background:c,border:`1px solid ${C.border}`}}/>
          `)}
        </div>
        <${Label} mb=${0}>Peak<//>
      </div>
    </div>`;
};

/* ── SVG LINE CHART ───────────────────────────────── */
const LineChart = ({data,w=340,h=160}) => {
  if(!data||data.length<2) return html`
    <div style=${{height:h,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,color:C.dim,fontStyle:'italic'}}>
      Trajectory unlocks after your first evening review.
    </div>`;
  const max=100, min=0;
  const xs=data.map((_,i)=>i*(w/(data.length-1)));
  const ys=data.map(d=>h-((d.score-min)/(max-min))*h);
  const path='M'+xs.map((x,i)=>`${x},${ys[i]}`).join(' L');
  const fill=path+` L${xs[xs.length-1]},${h} L0,${h} Z`;
  return html`
    <svg width="100%" viewBox=${'0 0 '+w+' '+h} style=${{overflow:'visible'}}>
      <defs>
        <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color=${C.cyan}/><stop offset="50%" stop-color=${C.violet}/><stop offset="100%" stop-color=${C.pink}/>
        </linearGradient>
        <linearGradient id="lg2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color=${C.violet} stop-opacity=".4"/><stop offset="100%" stop-color=${C.violet} stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d=${fill} fill="url(#lg2)"/>
      <path d=${path} fill="none" stroke="url(#lg1)" stroke-width="2"/>
      ${data.map((d,i)=>html`
        <text x=${xs[i]} y=${h+14} text-anchor="middle" font-size="9" fill=${C.dim}>${d.day}</text>
      `)}
    </svg>`;
};

/* ── BAR CHART ────────────────────────────────────── */
const BarChart = ({data,w=340,h=120}) => {
  if(!data||data.length===0) return null;
  const max=Math.max(...data.map(d=>d.actions),1);
  const bw=Math.max(4,(w/data.length)-2);
  return html`
    <svg width="100%" viewBox=${'0 0 '+w+' '+h} style=${{overflow:'visible'}}>
      <defs>
        <linearGradient id="lg3" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color=${C.violet}/><stop offset="100%" stop-color=${C.pink}/>
        </linearGradient>
      </defs>
      ${data.map((d,i)=>{
        const bh=(d.actions/max)*h;
        const x=i*(w/data.length)+1;
        return html`<rect x=${x} y=${h-bh} width=${bw} height=${bh} fill="url(#lg3)" rx="2"/>`;
      })}
    </svg>`;
};

      <button onClick=${()=>{if(!entry.trim())return;onSave({text:entry,at:new Date().toISOString()});setEntry('');}}
        disabled=${!entry.trim()}
        style=${{marginTop:16,width:'100%',padding:'12px 24px',fontSize:11,letterSpacing:'0.25em',textTransform:'uppercase',border:`1px solid ${C.border}`,color:C.text,background:'transparent'}}>
        + Log entry
      </button>
      <${Div} label=${'Archive · '+(data.journal||[]).length}/>
      <div style=${{display:'flex',flexDirection:'column',gap:24}}>
        ${(data.journal||[]).length===0&&html`
          <div style=${{fontSize:12,color:C.dim,fontStyle:'italic',textAlign:'center',padding:32}}>Thoughts logged here. Writing separates the thinker from the thought.</div>`}
        ${[...(data.journal||[])].reverse().map((j,i)=>html`
          <div key=${i} style=${{borderLeft:`1px solid ${C.border}`,paddingLeft:20}}>
            <${Label} mb=${8}>${fmtDate(j.at)} · ${new Date(j.at).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}<//>
            <div class="serif" style=${{fontSize:14,color:'#d4d4d4',lineHeight:1.6}}>${j.text}</div>
          </div>`)}

};

/* ── PROGRESS ─────────────────────────────────────── */
const Progress = ({data,onBack,currentDay,identityScore}) => {
  const ci=data.checkIns||[];
  const completedDays=ci.filter(c=>c.evening).length;
  const totalActions=ci.reduce((a,c)=>a+(c.actionsCompleted||0),0);
  const cleanRuns=ci.filter(c=>c.evening&&c.evening.sabotage===false).length;

  const scoreData=useMemo(()=>{
    const sorted=[...ci].sort((a,b)=>new Date(a.date)-new Date(b.date));
    return sorted.map((c,i)=>{
      const sub=sorted.slice(0,i+1);
      const both=sub.filter(x=>x.morning&&x.evening).length;
      const acts=sub.reduce((a,x)=>a+((x.actionsCompleted||0)/Math.max(1,data.actions.length)),0)/sub.length;
      const clean=sub.filter(x=>x.evening&&x.evening.sabotage===false).length/sub.length;
      const score=Math.round(Math.min(100,(acts*40)+(clean*30)+((both/sub.length)*30)));
      return {day:c.day,score,actions:c.actionsCompleted||0};
    });
  },[ci,data.actions]);

  const milestones=[
    {day:7, label:'Myelination begins'},
    {day:14,label:'Automaticity stage I'},
    {day:21,label:'Neural scaffolding'},
    {day:30,label:'Identity emerging'},
    {day:45,label:'Midpoint threshold'},
    {day:60,label:'Integration phase'},
    {day:66,label:'Habit automaticity'},
    {day:90,label:'Protocol complete'},
  ];

  const fileRef=useRef(null);
  const exportData=()=>{
    const blob=new Blob([JSON.stringify({app:'SHIFT Pro',v:3,exported:new Date().toISOString(),data},null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`shift-backup-${todayISO()}.json`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  };

  return html`
    <div style=${S.screen}>
      <${Header} title="Arc of Change" sub="PROGRESS · METRICS" onBack=${onBack}/>

      <!-- Heatmap -->
      <div style=${S.card({padding:24,marginBottom:48})}>
        <${Heatmap} checkIns=${ci} currentDay=${currentDay} actionsPerDay=${data.actions.length}/>
      </div>

      <!-- Stats -->
      <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:40}}>
        ${[
          {label:'DAYS LOGGED',  val:completedDays,color:C.cyan},
          {label:'STREAK',       val:data.streak,  color:C.violet},
          {label:'ACTIONS TOTAL',val:totalActions, color:C.pink},
          {label:'CLEAN RUNS',   val:cleanRuns,    color:C.cyan},
        ].map(s=>html`
          <div style=${S.card({padding:20})}>
            <div style=${{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
              <div style=${{width:6,height:6,background:s.color}}></div>
              <div style=${{fontSize:10,letterSpacing:'0.3em',textTransform:'uppercase',color:C.dim}}>${s.label}</div>
            </div>
            <div class="serif" style=${{fontSize:36,fontWeight:300,letterSpacing:'-0.03em'}}>${s.val}</div>
          </div>`)}
      </div>

      <${Div} label="Identity Trajectory"/>

      <!-- Score chart -->
      <div style=${S.card({padding:20,marginBottom:48})}>
        <div style=${{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:20}}>
          <${Label} mb=${0}>Score over time<//>
          <${Gt} size=${28}>${Math.round(identityScore)}<//>
        </div>
        <${LineChart} data=${scoreData}/>
      </div>

      <!-- Actions bar -->
      ${scoreData.length>0&&html`
        <div style=${S.card({padding:20,marginBottom:48})}>
          <${Label} mb=${20}>Actions per day<//>
          <${BarChart} data=${scoreData}/>
        </div>`}

      <${Div} label="Milestones"/>

      <div style=${{display:'flex',flexDirection:'column',gap:12,marginBottom:48}}>
        ${milestones.map(m=>{
          const reached=currentDay>=m.day;
          return html`
            <div style=${{display:'flex',alignItems:'center',gap:20,paddingTop:8,paddingBottom:8}}>
              <div class="${reached?'grad ':''} serif" style=${{fontSize:22,fontWeight:300,width:48,color:reached?undefined:C.faint}}>${pad(m.day)}</div>
              <div style=${{flex:1,borderBottom:`1px dashed ${C.border}`,paddingBottom:4}}>
                <div style=${{fontSize:12,letterSpacing:'0.05em',color:reached?C.text:C.dim}}>${m.label}</div>
              </div>
              <div style=${{color:reached?C.violet:C.ghost,fontSize:14}}>${reached?'■':'□'}</div>
            </div>`;
        })}
      </div>

      <${Div} label="Data Backup"/>

      <div style=${{display:'flex',flexDirection:'column',gap:12}}>
        <button onClick=${exportData} style=${{
          width:'100%',padding:'16px 24px',fontSize:11,letterSpacing:'0.25em',textTransform:'uppercase',
          border:`1px solid ${C.violet}`,color:C.violet,background:`${C.violet}08`,
        }}>→ Download Backup (JSON)</button>
        <div style=${{fontSize:11,color:C.dim,lineHeight:1.6}}>Download a JSON backup to save to iCloud Drive, Google Drive, or email to yourself. Restore via Settings.</div>
      </div>
    </div>`;
};

        <div style=${{display:'flex',flexDirection:'column',gap:20}}>
          <${Label} mb=${16}>Micro-protocols · installable in &lt;12 minutes<//>
          ${PRACTICES.map((p,i)=>html`
            <div style=${S.card({padding:20,position:'relative',overflow:'hidden'})}>
              <div style=${{position:'absolute',top:0,left:0,width:4,height:'100%',background:G}}></div>
              <div style=${{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:12}}>
                <${Label} color=${C.violet} mb=${0}>Protocol ${pad(i+1)}<//>
                <${Gt} size=${20}>${p.dur}<//>
              </div>
              <div class="serif" style=${{fontSize:18,fontWeight:300,color:C.text,marginBottom:12}}>${p.title}</div>
              <div style=${{fontSize:12,color:C.dim,lineHeight:1.6}}>${p.body}</div>

/* ── SETTINGS ─────────────────────────────────────── */
const Settings = ({data,onSave,onBack,onReset,onImport}) => {
  const [goal,setGoal]=useState(data.goal);
  const [minutes,setMinutes]=useState(data.minutes);
  const [actions,setActions]=useState([...data.actions]);
  const [confirmReset,setConfirmReset]=useState(false);
  const fileRef=useRef(null);

  const exportData=()=>{
    const blob=new Blob([JSON.stringify({app:'SHIFT Pro',v:3,exported:new Date().toISOString(),data},null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`shift-backup-${todayISO()}.json`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  };

  return html`
    <div style=${S.screen}>
      <${Header} title="Configuration" sub="SETTINGS" onBack=${onBack}/>

      <${Label} color=${C.violet} mb=${12}>90-day target<//>
      <${Textarea} value=${goal} onChange=${setGoal} rows=${4} placeholder="Your goal"/>
      <div style=${{height:32}}></div>

      <${Label} color=${C.violet} mb=${12}>Daily minutes<//>
      <div style=${{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:32}}>
        ${[10,15,20,30].map(m=>html`
          <button onClick=${()=>setMinutes(m)} class="${minutes===m?'grad ':''}serif" style=${{
            padding:'16px 0',fontSize:18,fontWeight:300,
            border:`1px solid ${minutes===m?C.violet:C.border}`,
            background:minutes===m?`${C.violet}10`:'transparent',
          }}>${m}</button>`)}
      </div>

      <${Label} color=${C.violet} mb=${12}>Daily actions<//>
      <div style=${{display:'flex',flexDirection:'column',gap:8,marginBottom:32}}>
        ${actions.map((a,i)=>html`
          <div style=${{display:'flex',alignItems:'center',gap:12,padding:12,border:`1px solid ${C.border}`}}>
            <div style=${{fontSize:11,color:C.violet}}>${pad(i+1)}</div>
            <input value=${a} onInput=${e=>{const n=[...actions];n[i]=e.target.value;setActions(n);}}
              style=${{flex:1,fontSize:14,color:C.text,background:'transparent',outline:'none'}}/>
            <button onClick=${()=>setActions(actions.filter((_,j)=>j!==i))} style=${{color:C.dim}}>×</button>
          </div>`)}
        ${actions.length<4&&html`
          <button onClick=${()=>setActions([...actions,'New action'])}
            style=${{padding:12,border:`1px dashed ${C.border}`,fontSize:11,letterSpacing:'0.2em',textTransform:'uppercase',color:C.dim}}>
            + Add
          </button>`}
      </div>

      <${Btn} variant="gradient" onClick=${()=>onSave({goal,minutes,actions})}>Save Changes<//>

      <${Div} label="Data"/>

      <div style=${{display:'flex',flexDirection:'column',gap:12,marginBottom:40}}>
        <button onClick=${exportData} style=${{
          width:'100%',padding:'16px 24px',fontSize:11,letterSpacing:'0.25em',textTransform:'uppercase',
          border:`1px solid ${C.violet}`,color:C.violet,background:`${C.violet}08`,
        }}>→ Download Backup (JSON)</button>
        <input ref=${fileRef} type="file" accept="application/json" style=${{display:'none'}}
          onChange=${e=>{if(e.target.files[0])onImport(e.target.files[0]);}}/>
        <button onClick=${()=>fileRef.current?.click()} style=${{
          width:'100%',padding:'16px 24px',fontSize:11,letterSpacing:'0.25em',textTransform:'uppercase',
          border:`1px solid ${C.border}`,color:C.dim,background:'transparent',
        }}>⟶ Restore from Backup</button>
        <div style=${{fontSize:11,color:C.dim,lineHeight:1.6}}>Your data lives in this browser's localStorage. Download a JSON backup to iCloud Drive, Google Drive, or email yourself. Restore anytime.</div>
      </div>

      <${Div}/>
      <${Label} color=${C.pink} mb=${12}>Danger zone<//>
      ${!confirmReset
        ? html`<button onClick=${()=>setConfirmReset(true)} style=${{width:'100%',padding:'12px 24px',fontSize:11,letterSpacing:'0.2em',textTransform:'uppercase',border:`1px solid ${C.border}`,color:C.dim,background:'transparent'}}>Reset Protocol</button>`
        : html`
          <div>
            <div style=${{fontSize:12,color:C.dim,marginBottom:12}}>Erases all data. Day counter returns to zero. Proceed?</div>
            <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              <button onClick=${()=>setConfirmReset(false)} style=${{padding:'12px 0',border:`1px solid ${C.border}`,fontSize:11,letterSpacing:'0.2em',textTransform:'uppercase',color:C.dim,background:'transparent'}}>Cancel</button>
              <button onClick=${onReset} style=${{padding:'12px 0',border:`1px solid #7f1d1d`,fontSize:11,letterSpacing:'0.2em',textTransform:'uppercase',color:C.pink,background:'transparent'}}>Confirm</button>
            </div>

    </div>`;
};

/* ── MAIN APP ─────────────────────────────────────── */
const App = () => {
  const [view,setView]=useState('home');
  const [data,setData]=useState(()=>{
    const saved=load();
    return saved || {onboarded:false,startDate:null,minutes:20,goal:'',actions:[],streak:0,checkIns:[],journal:[]};
  });

  const persist=d=>{setData(d);save(d);};

  const currentDay=useMemo(()=>{
    if(!data.startDate) return 0;
    return Math.min(90,Math.max(1,daysBetween(data.startDate,todayISO())+1));
  },[data.startDate]);

  const insight=useMemo(()=>INSIGHTS.find(i=>i.day===currentDay)||INSIGHTS[0],[currentDay]);

  const todayCi=(data.checkIns||[]).find(c=>c.date===todayISO());
  const morningDone=!!(todayCi&&todayCi.morning);
  const eveningDone=!!(todayCi&&todayCi.evening);
  const actionStates=useMemo(()=>{
    if(todayCi&&todayCi.actionStates) return todayCi.actionStates;
    return (data.actions||[]).map(()=>false);
  },[todayCi,data.actions]);
  const actionsCompleted=actionStates.filter(Boolean).length;

  const con=useMemo(()=>{
    const ci=data.checkIns||[];if(!ci.length)return 0;
    return (ci.filter(c=>c.morning&&c.evening).length/ci.length)*100;
  },[data.checkIns]);
  const act=useMemo(()=>{
    const ci=data.checkIns||[];if(!ci.length)return 0;
    const t=data.actions.length||1;
    return (ci.reduce((a,c)=>a+((c.actionsCompleted||0)/t),0)/ci.length)*100;
  },[data.checkIns,data.actions]);
  const clean=useMemo(()=>{
    const we=(data.checkIns||[]).filter(c=>c.evening);if(!we.length)return 0;
    return (we.filter(c=>c.evening.sabotage===false).length/we.length)*100;
  },[data.checkIns]);
  const identityScore=useMemo(()=>Math.round(Math.min(100,(act*.4)+(clean*.3)+(con*.3))),[con,act,clean]);

  const toggleAction=i=>{
    const date=todayISO();
    const ci=[...(data.checkIns||[])];
    let idx=ci.findIndex(c=>c.date===date);
    if(idx<0){ci.push({date,day:currentDay,morning:null,evening:null,actionStates:data.actions.map(()=>false),actionsCompleted:0});idx=ci.length-1;}
    const st=[...(ci[idx].actionStates||data.actions.map(()=>false))];
    st[i]=!st[i];
    ci[idx]={...ci[idx],actionStates:st,actionsCompleted:st.filter(Boolean).length};
    persist({...data,checkIns:ci});
  };

  const saveMorning=m=>{
    const date=todayISO();
    const ci=[...(data.checkIns||[])];
    let idx=ci.findIndex(c=>c.date===date);
    if(idx<0) ci.push({date,day:currentDay,morning:m,evening:null,actionStates:data.actions.map(()=>false),actionsCompleted:0});
    else ci[idx]={...ci[idx],morning:m};
    const sorted=ci.filter(c=>c.morning).sort((a,b)=>new Date(b.date)-new Date(a.date));
    let streak=0,cursor=new Date(todayISO());
    for(const c of sorted){
      const d=Math.round((cursor-new Date(c.date))/86400000);
      if(d<=1){streak++;cursor=new Date(c.date);cursor.setDate(cursor.getDate()-1);}else break;
    }
    persist({...data,checkIns:ci,streak});
    setView('home');
  };

  const saveEvening=e=>{
    const date=todayISO();
    const ci=[...(data.checkIns||[])];
    let idx=ci.findIndex(c=>c.date===date);
    if(idx<0) ci.push({date,day:currentDay,morning:null,evening:e,actionStates:data.actions.map(()=>false),actionsCompleted:0});
    else ci[idx]={...ci[idx],evening:e};
    persist({...data,checkIns:ci});
    setView('home');
  };

  const importBackup=file=>{
    const r=new FileReader();
    r.onload=e=>{
      try{
        const p=JSON.parse(e.target.result);
        const restored=p.data||p;
        if(restored&&restored.onboarded!==undefined){persist(restored);alert('Backup restored.');}
        else alert('Invalid backup file.');
      }catch{alert('Invalid backup file.');}
    };
    r.readAsText(file);
  };

  if(!data.onboarded) return html`<${Onboarding} onComplete=${d=>persist({...data,...d,onboarded:true,startDate:todayISO(),streak:0,checkIns:[],journal:[]})}/>`;

  return html`
    <div>
      ${view==='home'    &&html`<${Dashboard} data=${data} onNav=${setView} actionStates=${actionStates} onToggle=${toggleAction} onMorning=${()=>setView('morning')} onEvening=${()=>setView('evening')} insight=${insight} morningDone=${morningDone} eveningDone=${eveningDone} currentDay=${currentDay} con=${con} act=${act} clean=${clean}/>`}
      ${view==='morning' &&html`<${Morning}   onComplete=${saveMorning}                   onBack=${()=>setView('home')}/>`}
      ${view==='evening' &&html`<${Evening}   onComplete=${saveEvening} actionsCompleted=${actionsCompleted} totalActions=${data.actions.length} onBack=${()=>setView('home')}/>`}
      ${view==='journal' &&html`<${Journal}   data=${data} onSave=${e=>persist({...data,journal:[...(data.journal||[]),e]})} onBack=${()=>setView('home')}/>`}
      ${view==='progress'&&html`<${Progress}  data=${data} onBack=${()=>setView('home')} currentDay=${currentDay} identityScore=${identityScore}/>`}
      ${view==='wisdom'  &&html`<${Wisdom}    onBack=${()=>setView('home')} currentDay=${currentDay}/>`}
      ${view==='settings'&&html`<${Settings}  data=${data} onSave=${d=>{ persist({...data,...d}); setView('home'); }} onBack=${()=>setView('home')} onReset=${()=>{ persist({onboarded:false,startDate:null,minutes:20,goal:'',actions:[],streak:0,checkIns:[],journal:[]}); setView('home'); }} onImport=${importBackup}/>`}
    </div>`;
};

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
